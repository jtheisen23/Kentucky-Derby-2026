winner_reason: |
  REVISED post-storm. Original pick was Percy's Bar based on a fast-track
  closer setup. Severe weather hit Churchill Downs immediately after the
  Eight Belles (R6) was rushed in, and the Oaks card was delayed — the
  dirt track will almost certainly be off (sloppy / muddy / wet-fast) for
  the Oaks. That swings the read:
    - Closers (Percy's Bar, Counting Stars, Always A Runner) have to splash
      through tiring moisture; their late kicks get blunted
    - Tactical / forward types (Zany, Meaning, Explora) get a much better
      trip if the track plays speed-favoring as Churchill mud often does
    - Zany is a proven G2 winner at the 1 1/8 distance with Pletcher/Irad —
      a profile that travels well over an off track
  Confirm the actual track condition at post; if Churchill miraculously
  comes up fast, revert to Percy's Bar.
