name: 2026 Kentucky Oaks Day
date: 2026-05-01
track: Churchill Downs
slug: oaks_day
notes: |
  13-race card. First post 10:30 AM ET; Kentucky Oaks (race 13) at 8:40 PM ET.
  Seven graded stakes: Unbridled Sidney (G2T, R7), Eight Belles (G2, R8),
  Alysheba (G2, R9), Modesty (G3T, R10), La Troienne (G1, R11), Edgewood
  (G2T, R12), Kentucky Oaks (G1, R13). Severe storms hit Churchill Downs
  immediately after the Eight Belles (R8) and delayed every later race.
  Earlier post times for non-stakes (R1-R6) are approximate; verify on the
  Churchill Downs / Equibase board.
