[project]
name = "kd-analysis"
version = "0.1.0"
description = "Betting analysis for the 2026 Kentucky Oaks and Derby"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kd = "kd_analysis.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kd_analysis"]
